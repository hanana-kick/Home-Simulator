name: Publish Home Simulator to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Assemble standalone viewer and CAD assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/cad _site/references
          cat source/viewer/part-*.txt > _site/index.html
          echo 'a1f093c852d001c31db96d481019223361f0a068305fbca4539486759d60cca5  _site/index.html' | sha256sum --check -
          cp cad/floorplan_3d.step cad/floorplan_3d.dxf cad/floorplan_3d.glb cad/floorplan_3d.scad cad/model.json _site/cad/
          cp references/*.jpg _site/references/
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/cad/floorplan_3d.step
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
